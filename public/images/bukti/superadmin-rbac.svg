<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="2"/>

  <!-- Top Title Banner -->
  <rect x="25" y="25" width="850" height="60" rx="12" fill="url(#headerGrad3)"/>
  <text x="50" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
    Struktur Wewenang &amp; Hak Akses Admin Pusat vs Admin/HRD vs Pegawai (RBAC)
  </text>
  <text x="50" y="76" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12">
    Bab 3 Sub-bab 3.3.2 • Pemisahan Wewenang Aktor (Penggantian Superadmin menjadi Admin Pusat)
  </text>

  <!-- 3 Role Columns -->
  <!-- Column 1: Admin Pusat (Pimpinan & IT Master) -->
  <g transform="translate(35, 105)">
    <rect width="260" height="420" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="55" rx="14" fill="#4338ca"/>
    <circle cx="30" cy="28" r="14" fill="#6366f1"/>
    <text x="30" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">🏛️</text>
    <text x="55" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">ADMIN PUSAT</text>
    <text x="55" y="44" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10">Pimpinan &amp; Administrator Pusat</text>

    <!-- Features list -->
    <g transform="translate(15, 70)" font-family="system-ui, sans-serif" font-size="11">
      <rect width="230" height="40" rx="6" fill="#0f172a" stroke="#3730a3"/>
      <text x="10" y="18" fill="#a5b4fc" font-weight="bold">✓ Manajemen Akun &amp; Role</text>
      <text x="10" y="32" fill="#94a3b8" font-size="10">Kelola akun Admin Cabang/HRD &amp; User</text>

      <rect y="48" width="230" height="40" rx="6" fill="#0f172a" stroke="#3730a3"/>
      <text x="10" y="66" fill="#a5b4fc" font-weight="bold">✓ Konfigurasi Geofencing Kantor</text>
      <text x="10" y="80" fill="#94a3b8" font-size="10">Atur koordinat GPS kantor pusat &amp; cabang</text>

      <rect y="96" width="230" height="40" rx="6" fill="#0f172a" stroke="#3730a3"/>
      <text x="10" y="114" fill="#a5b4fc" font-weight="bold">✓ Approval Penggajian / Payroll</text>
      <text x="10" y="128" fill="#94a3b8" font-size="10">Otorisasi akhir pengeluaran gaji bulanan</text>

      <rect y="144" width="230" height="40" rx="6" fill="#0f172a" stroke="#3730a3"/>
      <text x="10" y="162" fill="#a5b4fc" font-weight="bold">✓ Monitoring Audit Log Sistem</text>
      <text x="10" y="176" fill="#94a3b8" font-size="10">Pantau insiden Mock Location / Fake GPS</text>

      <rect y="192" width="230" height="40" rx="6" fill="#0f172a" stroke="#3730a3"/>
      <text x="10" y="210" fill="#a5b4fc" font-weight="bold">✓ Laporan Rekapitulasi Eksekutif</text>
      <text x="10" y="224" fill="#94a3b8" font-size="10">Export rekapitulasi data lintas divisi</text>

      <!-- Badge Full Access -->
      <rect y="250" width="230" height="30" rx="6" fill="#312e81"/>
      <text x="115" y="270" text-anchor="middle" fill="#818cf8" font-weight="bold">Level Hak Akses: Tingkat Pusat</text>
    </g>
  </g>

  <!-- Column 2: Admin Cabang / HRD -->
  <g transform="translate(320, 105)">
    <rect width="260" height="420" rx="14" fill="#0f2942" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="55" rx="14" fill="#0284c7"/>
    <circle cx="30" cy="28" r="14" fill="#0ea5e9"/>
    <text x="30" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">💼</text>
    <text x="55" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">ADMIN / HRD</text>
    <text x="55" y="44" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10">Personalia &amp; Operasional Cabang</text>

    <!-- Features list -->
    <g transform="translate(15, 70)" font-family="system-ui, sans-serif" font-size="11">
      <rect width="230" height="40" rx="6" fill="#082f49" stroke="#0369a1"/>
      <text x="10" y="18" fill="#7dd3fc" font-weight="bold">✓ Manajemen Data Karyawan</text>
      <text x="10" y="32" fill="#94a3b8" font-size="10">Input biodata, shift kerja &amp; divisi</text>

      <rect y="48" width="230" height="40" rx="6" fill="#082f49" stroke="#0369a1"/>
      <text x="10" y="66" fill="#7dd3fc" font-weight="bold">✓ Verifikasi Izin, Sakit &amp; Cuti</text>
      <text x="10" y="80" fill="#94a3b8" font-size="10">Validasi surat dokter &amp; bukti izin</text>

      <rect y="96" width="230" height="40" rx="6" fill="#082f49" stroke="#0369a1"/>
      <text x="10" y="114" fill="#7dd3fc" font-weight="bold">✓ Perhitungan Rekap Gaji</text>
      <text x="10" y="128" fill="#94a3b8" font-size="10">Generate draft payroll &amp; slip gaji</text>

      <rect y="144" width="230" height="40" rx="6" fill="#082f49" stroke="#0369a1"/>
      <text x="10" y="162" fill="#7dd3fc" font-weight="bold">✓ Monitoring Presensi Harian</text>
      <text x="10" y="176" fill="#94a3b8" font-size="10">Rekap status check in/out pegawai</text>

      <rect y="192" width="230" height="40" rx="6" fill="#082f49" stroke="#0369a1"/>
      <text x="10" y="210" fill="#f87171" font-weight="bold">✗ Konfigurasi Master GPS/Server</text>
      <text x="10" y="224" fill="#94a3b8" font-size="10">Dibatasi khusus Admin Pusat</text>

      <!-- Badge Access -->
      <rect y="250" width="230" height="30" rx="6" fill="#075985"/>
      <text x="115" y="270" text-anchor="middle" fill="#7dd3fc" font-weight="bold">Level Hak Akses: Operasional Cabang</text>
    </g>
  </g>

  <!-- Column 3: Pegawai / Karyawan -->
  <g transform="translate(605, 105)">
    <rect width="260" height="420" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="55" rx="14" fill="#059669"/>
    <circle cx="30" cy="28" r="14" fill="#10b981"/>
    <text x="30" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">👤</text>
    <text x="55" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">PEGAWAI</text>
    <text x="55" y="44" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="10">User Aplikasi Mobile</text>

    <!-- Features list -->
    <g transform="translate(15, 70)" font-family="system-ui, sans-serif" font-size="11">
      <rect width="230" height="40" rx="6" fill="#022c22" stroke="#047857"/>
      <text x="10" y="18" fill="#6ee7b7" font-weight="bold">✓ Presensi Masuk (Check-In)</text>
      <text x="10" y="32" fill="#94a3b8" font-size="10">Scan wajah &amp; GPS Haversine</text>

      <rect y="48" width="230" height="40" rx="6" fill="#022c22" stroke="#047857"/>
      <text x="10" y="66" fill="#6ee7b7" font-weight="bold">✓ Presensi Pulang (Check-Out)</text>
      <text x="10" y="80" fill="#94a3b8" font-size="10">Validasi waktu kepulangan shift</text>

      <rect y="96" width="230" height="40" rx="6" fill="#022c22" stroke="#047857"/>
      <text x="10" y="114" fill="#6ee7b7" font-weight="bold">✓ Pengajuan Izin &amp; Lembur</text>
      <text x="10" y="128" fill="#94a3b8" font-size="10">Upload bukti &amp; deskripsi izin</text>

      <rect y="144" width="230" height="40" rx="6" fill="#022c22" stroke="#047857"/>
      <text x="10" y="162" fill="#6ee7b7" font-weight="bold">✓ Lihat Slip Gaji &amp; Riwayat</text>
      <text x="10" y="176" fill="#94a3b8" font-size="10">Download slip gaji format PDF</text>

      <rect y="192" width="230" height="40" rx="6" fill="#022c22" stroke="#047857"/>
      <text x="10" y="210" fill="#f87171" font-weight="bold">✗ Akses Data Pegawai Lain</text>
      <text x="10" y="224" fill="#94a3b8" font-size="10">Hanya melihat data pribadi</text>

      <!-- Badge Access -->
      <rect y="250" width="230" height="30" rx="6" fill="#065f46"/>
      <text x="115" y="270" text-anchor="middle" fill="#6ee7b7" font-weight="bold">Level Hak Akses: User Mobile</text>
    </g>
  </g>
</svg>
