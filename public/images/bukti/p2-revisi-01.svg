<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="umlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="20" y="20" width="760" height="45" rx="10" fill="#7e22ce"/>
  <text x="40" y="49" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">
    Gambar 3.4 Diagram Use Case Sistem Klasifikasi Citra Medis (Revisi Hal. 53)
  </text>

  <!-- System Boundary Box -->
  <rect x="230" y="85" width="340" height="340" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="250" y="110" fill="#6b21a8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Sistem Klasifikasi Citra Medis CNN</text>

  <!-- Actor 1: Tenaga Medis (Left) -->
  <circle cx="100" cy="190" r="18" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
  <line x1="100" y1="208" x2="100" y2="260" stroke="#7e22ce" stroke-width="3"/>
  <line x1="65" y1="225" x2="135" y2="225" stroke="#7e22ce" stroke-width="3"/>
  <line x1="100" y1="260" x2="75" y2="305" stroke="#7e22ce" stroke-width="3"/>
  <line x1="100" y1="260" x2="125" y2="305" stroke="#7e22ce" stroke-width="3"/>
  <text x="100" y="325" fill="#581c87" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tenaga Medis</text>

  <!-- Actor 2: Administrator (Right) -->
  <circle cx="700" cy="190" r="18" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
  <line x1="700" y1="208" x2="700" y2="260" stroke="#7e22ce" stroke-width="3"/>
  <line x1="665" y1="225" x2="735" y2="225" stroke="#7e22ce" stroke-width="3"/>
  <line x1="700" y1="260" x2="675" y2="305" stroke="#7e22ce" stroke-width="3"/>
  <line x1="700" y1="260" x2="725" y2="305" stroke="#7e22ce" stroke-width="3"/>
  <text x="700" y="325" fill="#581c87" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Administrator</text>

  <!-- Use Cases (Ellipses) -->
  <!-- UC 1: Login & Autentikasi -->
  <ellipse cx="400" cy="145" rx="100" ry="24" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="400" y="150" fill="#3b0764" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Login &amp; Autentikasi</text>

  <!-- UC 2: Upload Citra Medis -->
  <ellipse cx="400" cy="205" rx="105" ry="24" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="400" y="210" fill="#3b0764" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Unggah Citra Medis (DICOM/JPG)</text>

  <!-- UC 3: Prediksi & Inferensi CNN -->
  <ellipse cx="400" cy="265" rx="110" ry="24" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="400" y="270" fill="#581c87" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Proses Klasifikasi &amp; Diagnosa</text>

  <!-- UC 4: Lihat Hasil & Export Laporan PDF -->
  <ellipse cx="400" cy="325" rx="105" ry="24" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="400" y="330" fill="#3b0764" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Export Hasil &amp; Riwayat Pasien</text>

  <!-- UC 5: Kelola Bobot Model CNN -->
  <ellipse cx="400" cy="385" rx="100" ry="24" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="400" y="390" fill="#3b0764" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Kelola Model &amp; Dataset</text>

  <!-- Association Lines -->
  <!-- Actor 1 to UCs -->
  <line x1="120" y1="210" x2="300" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="130" y1="225" x2="295" y2="205" stroke="#64748b" stroke-width="1.5"/>
  <line x1="130" y1="235" x2="290" y2="265" stroke="#64748b" stroke-width="1.5"/>
  <line x1="120" y1="250" x2="295" y2="325" stroke="#64748b" stroke-width="1.5"/>

  <!-- Actor 2 to UCs -->
  <line x1="670" y1="210" x2="500" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="670" y1="240" x2="505" y2="325" stroke="#64748b" stroke-width="1.5"/>
  <line x1="670" y1="255" x2="500" y2="385" stroke="#64748b" stroke-width="1.5"/>
</svg>
