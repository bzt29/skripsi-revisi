  <text x="210" y="266" font-family="system-ui, sans-serif" font-size="13" fill="#475569">96.70 %</text>
  <text x="360" y="266" font-family="system-ui, sans-serif" font-size="13" fill="#475569">97.20 %</text>
  <text x="510" y="266" font-family="system-ui, sans-serif" font-size="13" fill="#475569">96.30 %</text>
  <text x="660" y="266" font-family="system-ui, sans-serif" font-size="13" fill="#475569">96.75 %</text>

