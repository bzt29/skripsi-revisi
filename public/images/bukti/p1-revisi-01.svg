  <text x="210" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#475569">96.20 %</text>
  <text x="360" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#475569">96.80 %</text>
  <text x="510" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#475569">95.60 %</text>
  <text x="660" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#475569">96.19 %</text>

