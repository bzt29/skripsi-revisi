  <text x="60" y="306" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#047857">Rata-rata (Avg)</text>
  <text x="210" y="306" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#047857">96.22 %</text>
  <text x="360" y="306" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#047857">96.48 %</text>
  <text x="510" y="306" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#047857">95.85 %</text>
  <text x="660" y="306" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#047857">96.16 %</text>

  <!-- Bottom Note -->
  <rect x="30" y="340" width="740" height="85" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="55" cy="382" r="14" fill="#10b981"/>
  <path d="M49 382 L53 386 L61 378" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="85" y="375" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">
