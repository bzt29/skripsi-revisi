  <text x="210" y="152" font-family="system-ui, sans-serif" font-size="13" fill="#475569">95.40 %</text>
  <text x="360" y="152" font-family="system-ui, sans-serif" font-size="13" fill="#475569">96.10 %</text>
  <text x="510" y="152" font-family="system-ui, sans-serif" font-size="13" fill="#475569">94.80 %</text>
  <text x="660" y="152" font-family="system-ui, sans-serif" font-size="13" fill="#475569">95.44 %</text>

