  <text x="60" y="228" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Fold 3</text>
  <text x="210" y="228" font-family="system-ui, sans-serif" font-size="13" fill="#475569">95.80 %</text>
  <text x="360" y="228" font-family="system-ui, sans-serif" font-size="13" fill="#475569">95.90 %</text>
  <text x="510" y="228" font-family="system-ui, sans-serif" font-size="13" fill="#475569">95.70 %</text>
  <text x="660" y="228" font-family="system-ui, sans-serif" font-size="13" fill="#475569">95.80 %</text>

