<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" rx="16" fill="url(#bgGrad2)" stroke="#334155" stroke-width="2"/>

  <!-- Top Title Banner -->
  <rect x="25" y="25" width="850" height="60" rx="12" fill="url(#headerGrad2)"/>
  <text x="50" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
    Redesain Antarmuka Home Mobile: Penambahan Statistik &amp; Penghapusan Map
  </text>
  <text x="50" y="76" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12">
    Bab 3 Sub-bab 3.6 Mockup UI/UX • Sistem Presensi &amp; Penggajian Mobile PT MJU
  </text>

  <!-- Mobile Frame 1: Sebelum Revisi (Ada Map) -->
  <g transform="translate(60, 105)">
    <rect width="210" height="380" rx="24" fill="#020617" stroke="#dc2626" stroke-width="2"/>
    <!-- Screen -->
    <rect x="8" y="10" width="194" height="360" rx="18" fill="#0f172a"/>
    <!-- Top Bar -->
    <rect x="18" y="20" width="174" height="40" rx="8" fill="#1e293b"/>
    <text x="28" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Presensi PT MJU</text>
    
    <!-- Old Map Area (Crossed out) -->
    <rect x="18" y="70" width="174" height="150" rx="8" fill="#1e3a8a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="105" y="130" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12">🗺️ Komponen Map</text>
    <text x="105" y="148" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="10">(Membebani Kinerja)</text>
    <line x1="25" y1="75" x2="185" y2="215" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="185" y1="75" x2="25" y2="215" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Small Checkin Button -->
    <rect x="18" y="230" width="174" height="36" rx="8" fill="#475569"/>
    <text x="105" y="252" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Check In</text>

    <!-- Label Underneath -->
    <rect x="15" y="390" width="180" height="24" rx="6" fill="#450a0a" stroke="#dc2626"/>
    <text x="105" y="406" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">✗ Tampilan Lama (Ada Map)</text>
  </g>

  <!-- Arrow Transition -->
  <g transform="translate(300, 260)">
    <circle cx="20" cy="20" r="22" fill="#4f46e5"/>
    <path d="M12 20 L24 20 M20 14 L26 20 L20 26" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="20" y="55" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">DIUBAH</text>
  </g>

  <!-- Mobile Frame 2: Sesudah Revisi (Statistik Presensi Lengkap) -->
  <g transform="translate(365, 105)">
    <rect width="230" height="420" rx="28" fill="#020617" stroke="#22c55e" stroke-width="2.5"/>
    <!-- Screen -->
    <rect x="9" y="10" width="212" height="400" rx="20" fill="url(#phoneGrad)"/>
    
    <!-- User Profile Header in App -->
    <g transform="translate(20, 22)">
      <circle cx="18" cy="18" r="16" fill="#4f46e5"/>
      <text x="18" y="23" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">H</text>
      <text x="42" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Syed M Hafiz F.</text>
      <text x="42" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">IT Support • PT MJU</text>
    </g>

    <!-- NEW Statistics Grid (4 Cards) -->
    <g transform="translate(20, 68)">
      <!-- Hadir -->
      <rect x="0" y="0" width="90" height="52" rx="8" fill="#064e3b" stroke="#059669"/>
      <text x="10" y="18" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9">Hadir (Bulan Ini)</text>
      <text x="10" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">22 Hari</text>

      <!-- Izin/Sakit -->
      <rect x="100" y="0" width="90" height="52" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="110" y="18" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="9">Izin / Sakit</text>
      <text x="110" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">1 Hari</text>

      <!-- Terlambat -->
      <rect x="0" y="60" width="90" height="52" rx="8" fill="#451a03" stroke="#d97706"/>
      <text x="10" y="78" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9">Terlambat</text>
      <text x="10" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">0 Kali</text>

      <!-- Lembur -->
      <rect x="100" y="60" width="90" height="52" rx="8" fill="#3b0764" stroke="#a855f7"/>
      <text x="110" y="78" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="9">Jam Lembur</text>
      <text x="110" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">8.5 Jam</text>
    </g>

    <!-- Quick Check-in/out Status Card -->
    <g transform="translate(20, 195)">
      <rect width="190" height="75" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Status Presensi Hari Ini</text>
      <circle cx="18" cy="45" r="5" fill="#10b981"/>
      <text x="30" y="49" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Check In: 07:54 WIB</text>
      <text x="12" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Radius GPS: 18m (Dalam Kantor)</text>
    </g>

    <!-- Prominent Check Out Action Button -->
    <g transform="translate(20, 285)">
      <rect width="190" height="42" rx="10" fill="url(#primaryBtn)"/>
      <text x="95" y="311" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">📸 Presensi Check Out</text>
    </g>

    <!-- Bottom Navigation Mockup -->
    <g transform="translate(20, 345)">
      <rect width="190" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="32" y="368" fill="#6366f1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">🏠 Home</text>
      <text x="95" y="368" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">📋 Riwayat</text>
      <text x="155" y="368" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">👤 Profil</text>
    </g>

    <!-- Label Underneath -->
    <rect x="25" y="435" width="180" height="24" rx="6" fill="#064e3b" stroke="#22c55e"/>
    <text x="115" y="451" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">✓ Tampilan Baru (Statistik)</text>
  </g>

  <!-- Right Explanation Card -->
  <g transform="translate(635, 115)">
    <rect width="230" height="390" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="18" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
      ✨ Poin Perbaikan Home:
    </text>

    <!-- Item 1 -->
    <g transform="translate(18, 45)">
      <circle cx="8" cy="8" r="6" fill="#10b981"/>
      <text x="20" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Menghapus Map</text>
      <text x="20" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Mengurangi load time aplikasi</text>
      <text x="20" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">&amp; konsumsi baterai pengguna.</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(18, 115)">
      <circle cx="8" cy="8" r="6" fill="#6366f1"/>
      <text x="20" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">4 Kartu Statistik</text>
      <text x="20" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Rekap Hadir, Izin/Sakit,</text>
      <text x="20" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Terlambat, dan Jam Lembur.</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(18, 185)">
      <circle cx="8" cy="8" r="6" fill="#06b6d4"/>
      <text x="20" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Validasi Status Harian</text>
      <text x="20" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Menampilkan jam check in &amp;</text>
      <text x="20" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">radius toleransi Haversine.</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(18, 255)">
      <circle cx="8" cy="8" r="6" fill="#ec4899"/>
      <text x="20" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Fokus Call to Action</text>
      <text x="20" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Tombol presensi wajah</text>
      <text x="20" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">lebih besar dan intuitif.</text>
    </g>

    <!-- Box status info -->
    <rect x="18" y="325" width="194" height="45" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="28" y="345" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Rujukan Naskah Skripsi:</text>
    <text x="28" y="360" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Bab 3 Sub-bab 3.6 • Hal. 52-55</text>
  </g>
</svg>
