<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Top Title Banner -->
  <rect x="25" y="25" width="850" height="60" rx="12" fill="url(#accentGrad)"/>
  <text x="50" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
    Dokumentasi Pengujian Dataset Face Recognition (Multi-Shot 3-5 Foto)
  </text>
  <text x="50" y="76" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12">
    Bab 4 Sub-bab 4.4 • Registrasi Dataset &amp; Ekstraksi Embedding Wajah Karyawan PT MJU
  </text>

  <!-- 5 Sample Photo Cards -->
  <!-- Card 1: Foto 1 - Tampak Depan Netral -->
  <g transform="translate(35, 105)">
    <rect width="155" height="230" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="12" y="12" width="131" height="130" rx="8" fill="#090d16" stroke="#3b82f6" stroke-dasharray="4,2"/>
    <!-- Face Icon Front -->
    <circle cx="77" cy="65" r="32" fill="#3b82f6" fill-opacity="0.2"/>
    <circle cx="77" cy="62" r="22" fill="#60a5fa"/>
    <circle cx="71" cy="58" r="3" fill="#1e293b"/>
    <circle cx="83" cy="58" r="3" fill="#1e293b"/>
    <path d="M72 70 Q77 74 82 70" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M57 110 Q77 92 97 110" fill="#3b82f6"/>
    <!-- Bounding Box & Landmarks -->
    <rect x="35" y="30" width="85" height="85" rx="4" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <text x="40" y="42" fill="#22c55e" font-family="monospace" font-size="9">99.4% Match</text>
    <text x="77" y="165" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Foto 1: Depan</text>
    <text x="77" y="182" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Sudut 0° (Netral)</text>
    <rect x="25" y="195" width="105" height="20" rx="4" fill="#065f46"/>
    <text x="77" y="209" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">✓ Terdaftar</text>
  </g>

  <!-- Card 2: Foto 2 - Serong Kiri (15-30°) -->
  <g transform="translate(205, 105)">
    <rect width="155" height="230" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="12" y="12" width="131" height="130" rx="8" fill="#090d16" stroke="#6366f1" stroke-dasharray="4,2"/>
    <!-- Face Icon Left Tilt -->
    <circle cx="77" cy="65" r="32" fill="#6366f1" fill-opacity="0.2"/>
    <ellipse cx="73" cy="62" rx="20" ry="22" fill="#818cf8"/>
    <circle cx="68" cy="58" r="3" fill="#1e293b"/>
    <circle cx="80" cy="58" r="2.5" fill="#1e293b"/>
    <path d="M68 70 Q73 74 77 71" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M57 110 Q73 92 97 110" fill="#6366f1"/>
    <!-- Bounding Box -->
    <rect x="35" y="30" width="85" height="85" rx="4" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <text x="40" y="42" fill="#22c55e" font-family="monospace" font-size="9">98.1% Match</text>
    <text x="77" y="165" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Foto 2: Serong Kiri</text>
    <text x="77" y="182" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Sudut -20° (Kiri)</text>
    <rect x="25" y="195" width="105" height="20" rx="4" fill="#065f46"/>
    <text x="77" y="209" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">✓ Terdaftar</text>
  </g>

  <!-- Card 3: Foto 3 - Serong Kanan (15-30°) -->
  <g transform="translate(375, 105)">
    <rect width="155" height="230" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="12" y="12" width="131" height="130" rx="8" fill="#090d16" stroke="#8b5cf6" stroke-dasharray="4,2"/>
    <!-- Face Icon Right Tilt -->
    <circle cx="77" cy="65" r="32" fill="#8b5cf6" fill-opacity="0.2"/>
    <ellipse cx="81" cy="62" rx="20" ry="22" fill="#a78bfa"/>
    <circle cx="74" cy="58" r="2.5" fill="#1e293b"/>
    <circle cx="86" cy="58" r="3" fill="#1e293b"/>
    <path d="M77 71 Q81 74 86 70" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M57 110 Q81 92 97 110" fill="#8b5cf6"/>
    <!-- Bounding Box -->
    <rect x="35" y="30" width="85" height="85" rx="4" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <text x="40" y="42" fill="#22c55e" font-family="monospace" font-size="9">97.8% Match</text>
    <text x="77" y="165" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Foto 3: Serong Kanan</text>
    <text x="77" y="182" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Sudut +20° (Kanan)</text>
    <rect x="25" y="195" width="105" height="20" rx="4" fill="#065f46"/>
    <text x="77" y="209" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">✓ Terdaftar</text>
  </g>

  <!-- Card 4: Foto 4 - Ekspresi Tersenyum -->
  <g transform="translate(545, 105)">
    <rect width="155" height="230" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="12" y="12" width="131" height="130" rx="8" fill="#090d16" stroke="#ec4899" stroke-dasharray="4,2"/>
    <!-- Face Icon Smile -->
    <circle cx="77" cy="65" r="32" fill="#ec4899" fill-opacity="0.2"/>
    <circle cx="77" cy="62" r="22" fill="#f472b6"/>
    <circle cx="71" cy="58" r="3" fill="#1e293b"/>
    <circle cx="83" cy="58" r="3" fill="#1e293b"/>
    <path d="M70 68 Q77 78 84 68" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M57 110 Q77 92 97 110" fill="#ec4899"/>
    <!-- Bounding Box -->
    <rect x="35" y="30" width="85" height="85" rx="4" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <text x="40" y="42" fill="#22c55e" font-family="monospace" font-size="9">98.9% Match</text>
    <text x="77" y="165" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Foto 4: Ekspresi</text>
    <text x="77" y="182" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Senyum / Variasi</text>
    <rect x="25" y="195" width="105" height="20" rx="4" fill="#065f46"/>
    <text x="77" y="209" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">✓ Terdaftar</text>
  </g>

  <!-- Card 5: Foto 5 - Pencahayaan Redup / Low Light -->
  <g transform="translate(715, 105)">
    <rect width="155" height="230" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="12" y="12" width="131" height="130" rx="8" fill="#050810" stroke="#f59e0b" stroke-dasharray="4,2"/>
    <!-- Face Icon Low-light -->
    <circle cx="77" cy="65" r="32" fill="#f59e0b" fill-opacity="0.1"/>
    <circle cx="77" cy="62" r="22" fill="#94a3b8"/>
    <circle cx="71" cy="58" r="3" fill="#0f172a"/>
    <circle cx="83" cy="58" r="3" fill="#0f172a"/>
    <path d="M72 70 Q77 73 82 70" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M57 110 Q77 92 97 110" fill="#64748b"/>
    <!-- Bounding Box -->
    <rect x="35" y="30" width="85" height="85" rx="4" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <text x="40" y="42" fill="#22c55e" font-family="monospace" font-size="9">95.6% Match</text>
    <text x="77" y="165" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Foto 5: Low Light</text>
    <text x="77" y="182" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Pencahayaan Redup</text>
    <rect x="25" y="195" width="105" height="20" rx="4" fill="#065f46"/>
    <text x="77" y="209" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">✓ Terdaftar</text>
  </g>

  <!-- Bottom Analytics & Evaluation Summary Panel -->
  <g transform="translate(35, 355)">
    <rect width="830" height="175" rx="12" fill="#1e293b" stroke="#334155"/>
    
    <!-- Left Column: Metrics -->
    <text x="25" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">
      📊 Hasil Ekstraksi Embedding 128-Dimensi &amp; Akurasi Verifikasi
    </text>
    
    <g transform="translate(25, 45)">
      <rect width="180" height="55" rx="8" fill="#0f172a" stroke="#475569"/>
      <text x="15" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Sampel / User</text>
      <text x="15" y="44" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">3 - 5 Foto Wajah</text>
    </g>

    <g transform="translate(220, 45)">
      <rect width="180" height="55" rx="8" fill="#0f172a" stroke="#475569"/>
      <text x="15" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Threshold Euclidean Dist.</text>
      <text x="15" y="44" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">&le; 0.42 (Optimal)</text>
    </g>

    <g transform="translate(415, 45)">
      <rect width="180" height="55" rx="8" fill="#0f172a" stroke="#475569"/>
      <text x="15" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Rata-rata Akurasi</text>
      <text x="15" y="44" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">97.96 % (Tinggi)</text>
    </g>

    <g transform="translate(610, 45)">
      <rect width="195" height="55" rx="8" fill="#0f172a" stroke="#475569"/>
      <text x="15" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">False Acceptance Rate</text>
      <text x="15" y="44" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">0.82 % (Aman)</text>
    </g>

    <!-- Bottom summary text -->
    <rect x="25" y="115" width="780" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="40" y="140" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">
      <tspan font-weight="bold" fill="#38bdf8">Kesimpulan Perbaikan:</tspan> Registrasi multi-shot 3-5 foto mampu meminimalkan kegagalan presensi akibat variasi ekspresi, sudut kepala hingga 30°, dan kondisi pencahayaan di lokasi kerja PT MJU.
    </text>
  </g>
</svg>
