<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="headerGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" rx="16" fill="url(#bgGrad5)" stroke="#334155" stroke-width="2"/>

  <!-- Top Title Banner -->
  <rect x="25" y="20" width="850" height="55" rx="12" fill="url(#headerGrad5)"/>
  <text x="45" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="bold">
    Tabel 10 Indikator Pertanyaan Kuesioner SUS Baku Bahasa Indonesia (Brooke, 1996)
  </text>
  <text x="45" y="65" fill="#fdf4ff" font-family="system-ui, sans-serif" font-size="11">
    Bab 3 Sub-bab 3.7 &amp; Lampiran • Instrumen Pengujian Usability Sistem Presensi &amp; Penggajian PT MJU
  </text>

  <!-- Table Container -->
  <g transform="translate(25, 90)">
    <!-- Header -->
    <rect width="850" height="35" rx="8" fill="#334155"/>
    <text x="25" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">No</text>
    <text x="65" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Butir Pernyataan Kuesioner (Indikator SUS)</text>
    <text x="620" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Sifat Item</text>
    <text x="730" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Aturan Skor</text>

    <!-- Row 1 (Odd) -->
    <rect y="40" width="850" height="32" rx="4" fill="#1e293b"/>
    <text x="25" y="61" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Q1</text>
    <text x="65" y="61" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Saya berpikir akan sering menggunakan sistem presensi dan penggajian ini.</text>
    <rect x="615" y="46" width="75" height="20" rx="4" fill="#065f46"/>
    <text x="652" y="60" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Positif (Ganjil)</text>
    <text x="745" y="61" fill="#a7f3d0" font-family="monospace" font-size="11">Skor - 1</text>

    <!-- Row 2 (Even) -->
    <rect y="76" width="850" height="32" rx="4" fill="#0f172a"/>
    <text x="25" y="97" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Q2</text>
    <text x="65" y="97" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Saya merasa sistem ini terlalu rumit untuk digunakan.</text>
    <rect x="615" y="82" width="75" height="20" rx="4" fill="#831843"/>
    <text x="652" y="96" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Negatif (Genap)</text>
    <text x="745" y="97" fill="#fbcfe8" font-family="monospace" font-size="11">5 - Skor</text>

    <!-- Row 3 (Odd) -->
    <rect y="112" width="850" height="32" rx="4" fill="#1e293b"/>
    <text x="25" y="133" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Q3</text>
    <text x="65" y="133" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Saya merasa sistem presensi wajah dan lokasi ini mudah digunakan.</text>
    <rect x="615" y="118" width="75" height="20" rx="4" fill="#065f46"/>
    <text x="652" y="132" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Positif (Ganjil)</text>
    <text x="745" y="133" fill="#a7f3d0" font-family="monospace" font-size="11">Skor - 1</text>

    <!-- Row 4 (Even) -->
    <rect y="148" width="850" height="32" rx="4" fill="#0f172a"/>
    <text x="25" y="169" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Q4</text>
    <text x="65" y="169" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Saya membutuhkan bantuan orang teknis untuk dapat menggunakan sistem ini.</text>
    <rect x="615" y="154" width="75" height="20" rx="4" fill="#831843"/>
    <text x="652" y="168" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Negatif (Genap)</text>
    <text x="745" y="169" fill="#fbcfe8" font-family="monospace" font-size="11">5 - Skor</text>

    <!-- Row 5 (Odd) -->
    <rect y="184" width="850" height="32" rx="4" fill="#1e293b"/>
    <text x="25" y="205" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Q5</text>
    <text x="65" y="205" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Saya merasa berbagai fitur pada sistem ini terintegrasi dengan sangat baik.</text>
    <rect x="615" y="190" width="75" height="20" rx="4" fill="#065f46"/>
    <text x="652" y="204" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Positif (Ganjil)</text>
    <text x="745" y="205" fill="#a7f3d0" font-family="monospace" font-size="11">Skor - 1</text>

    <!-- Row 6 (Even) -->
    <rect y="220" width="850" height="32" rx="4" fill="#0f172a"/>
    <text x="25" y="241" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Q6</text>
    <text x="65" y="241" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Saya merasa ada terlalu banyak inkonsistensi pada sistem ini.</text>
    <rect x="615" y="226" width="75" height="20" rx="4" fill="#831843"/>
    <text x="652" y="240" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Negatif (Genap)</text>
    <text x="745" y="241" fill="#fbcfe8" font-family="monospace" font-size="11">5 - Skor</text>

    <!-- Row 7 (Odd) -->
    <rect y="256" width="850" height="32" rx="4" fill="#1e293b"/>
    <text x="25" y="277" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Q7</text>
    <text x="65" y="277" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Saya rasa kebanyakan orang akan mempelajari sistem ini dengan cepat.</text>
    <rect x="615" y="262" width="75" height="20" rx="4" fill="#065f46"/>
    <text x="652" y="276" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Positif (Ganjil)</text>
    <text x="745" y="277" fill="#a7f3d0" font-family="monospace" font-size="11">Skor - 1</text>

    <!-- Row 8 (Even) -->
    <rect y="292" width="850" height="32" rx="4" fill="#0f172a"/>
    <text x="25" y="313" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Q8</text>
    <text x="65" y="313" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Saya merasa sistem ini sangat membingungkan saat pertama kali dipakai.</text>
    <rect x="615" y="298" width="75" height="20" rx="4" fill="#831843"/>
    <text x="652" y="312" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Negatif (Genap)</text>
    <text x="745" y="313" fill="#fbcfe8" font-family="monospace" font-size="11">5 - Skor</text>

    <!-- Row 9 (Odd) -->
    <rect y="328" width="850" height="32" rx="4" fill="#1e293b"/>
    <text x="25" y="349" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Q9</text>
    <text x="65" y="349" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Saya merasa sangat percaya diri saat menggunakan sistem ini.</text>
    <rect x="615" y="334" width="75" height="20" rx="4" fill="#065f46"/>
    <text x="652" y="348" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Positif (Ganjil)</text>
    <text x="745" y="349" fill="#a7f3d0" font-family="monospace" font-size="11">Skor - 1</text>

    <!-- Row 10 (Even) -->
    <rect y="364" width="850" height="32" rx="4" fill="#0f172a"/>
    <text x="25" y="385" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Q10</text>
    <text x="65" y="385" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Saya harus mempelajari banyak hal sebelum saya bisa menggunakan sistem ini.</text>
    <rect x="615" y="370" width="75" height="20" rx="4" fill="#831843"/>
    <text x="652" y="384" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Negatif (Genap)</text>
    <text x="745" y="385" fill="#fbcfe8" font-family="monospace" font-size="11">5 - Skor</text>

    <!-- Formula Summary Card -->
    <rect y="405" width="850" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
    <text x="20" y="428" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      📐 Formula Skor Akhir SUS:
    </text>
    <text x="20" y="448" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">
      <tspan font-family="monospace" font-weight="bold" fill="#38bdf8">Skor SUS = [ &sum;(Q_ganjil - 1) + &sum;(5 - Q_genap) ] &times; 2.5</tspan> &bull; Hasil Evaluasi PT MJU: <tspan font-weight="bold" fill="#34d399">84.25 (Grade A - Excellent / Acceptable)</tspan>
    </text>
  </g>
</svg>
